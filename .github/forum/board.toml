# Proven Commons internal board: Discussions on Proven-Commons/mission, about the programme itself.
# The forum standard (FORUM-STANDARD.md in Proven-Commons/.github) describes every field; FORUM.md says the same
# in words, and names everyone who holds a seat. A seat changes only by pull request, approved by an owner.
# The tiers follow the academy ladder: graduation at each level is merged work that a computer checked.

version = 1
board = "internal"
repository = "Proven-Commons/mission"
public = true
name = "Proven Commons internal board"

[gate]
mode = "enforce"
count_orgs = ["Proven-Commons"]

[groups]
# Level 2: people who own a module that passed the verified bar with a separate reviewer.
verifiers = []
# Level 3: people who write and review specifications, run a squad and teach Level 1.
spec-leads = []
# The director and the head of verification once they are named (FOUNDING-BRIEF.md, Decisions needed now, 2), and the owners until then.
stewards = ["ahrazzle"]

# Tiers, lowest first. Anyone who reaches a tier may also post wherever a lower one may.
[[tiers]]
id = "apprentice"
name = "Apprentice (Level 1)"
merged_prs = 1
associations = ["OWNER", "MEMBER", "COLLABORATOR"]

[[tiers]]
id = "verifier"
name = "Verifier (Level 2)"
merged_prs = 15
groups = ["verifiers"]

[[tiers]]
id = "spec-lead"
name = "Spec Lead and Mentor (Level 3)"
groups = ["spec-leads"]

[[tiers]]
id = "stewards"
name = "Steward"
groups = ["stewards"]

# ---------------------------------------------------------------- Orientation

[[categories]]
slug = "announcements"
name = "Announcements"
emoji = ":mega:"
format = "announcement"
section = "Orientation"
description = "News about the programme itself from its stewards. Anyone replies."

[[categories]]
slug = "floor"
name = "Floor"
emoji = ":microphone:"
format = "open"
section = "Orientation"
description = "Open to everyone: anything about how Proven Commons is run, and the open answer to every gated room."

[[categories]]
slug = "decisions"
name = "Decisions"
emoji = ":white_check_mark:"
format = "announcement"
section = "Orientation"
description = "One thread per decision: what, who decided, why, and the issue or pull request that carries it out."
form = true


version = 1
owner = "Proven-Commons"

# Each library waits until its bar workflow and check run exist on main.
# No setting is applied by reading this file or running the planner.
[defaults]
minimum_reviews = 1
enforce_admins = true
# Used only when main has no protection yet, so the first protection
# matches the org baseline and MERGE-SOP's current-head approval.
dismiss_stale_reviews = true
required_conversation_resolution = true
workflow = ".github/workflows/bar.yml"
contexts = ["bar / bar"]

[[repository]]
name = "mission"
workflow = ".github/workflows/ci.yml"
contexts = ["self-test", "lean-self-test", "template / bar"]

[[repository]]
name = "tar"
deferred = "Wait for Set B PRs #4-6 and its bar workflow to land on main."


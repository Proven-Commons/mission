name: verified bar

on:
  push:
  pull_request:
  # Rerun when the spec reviewer approves, or an approval is dismissed.
  pull_request_review:
    types: [submitted, dismissed]

jobs:
  bar:
    # pull-requests: read lets the check confirm the spec approval on GitHub.
    permissions:
      contents: read
      pull-requests: read
    # Pin both lines to the same tag or commit of Proven-Commons/mission.
    uses: Proven-Commons/mission/.github/workflows/verified-bar.yml@main
    with:
      bar-ref: main
